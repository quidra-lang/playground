name: deploy

on:
  push:
    # Work lands on develop; publishing is a deliberate fast-forward of main,
    # matching how Quidra Core releases. It is also the only branch the
    # github-pages environment allows to deploy by default.
    branches: [main]
  workflow_dispatch:

# Pages stays static. Native Build/Run is a separate runner image; the page only
# receives its public URL at build time.
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

# Production normally runs from Playground main, which therefore resolves Core
# main. Manual dispatches keep the same branch-to-branch rule.
env:
  QUIDRA_CORE_REF: ${{ github.ref_name }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - name: Build the matching Quidra compiler frontend
        run: npm run core:build
      # Derive private npm package metadata from the same Core branch in this
      # ephemeral workspace before the ordinary version check runs.
      - name: Sync package metadata to matching Core
        run: npm run version:sync
      - name: Read the exact Core revision used by the page
        id: core
        run: |
          echo "sha=$(node -p 'require("./.core-build/core-metadata.json").coreCommit')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./.core-build/core-metadata.json").coreVersion')" >> "$GITHUB_OUTPUT"
      - name: Detect Cloudflare runner deployment configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Cloudflare Sandbox runner dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: runner/cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare exact-SHA Cloudflare runner deployment
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: runner/cloudflare
        env:
          QUIDRA_CORE_REF: ${{ steps.core.outputs.sha }}
          QUIDRA_CORE_VERSION: ${{ steps.core.outputs.version }}
          QUIDRA_PLAYGROUND_ORIGIN: ${{ vars.QUIDRA_PLAYGROUND_ORIGIN }}
        run: node scripts/configure.mjs
      - name: Deploy sandboxed Build/Run runner
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: runner/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: npx wrangler deploy --config wrangler.deploy.json
      - name: Resolve Build/Run runner URL
        id: runner-url
        env:
          CONFIGURED_RUNNER_URL: ${{ vars.QUIDRA_RUNNER_URL }}
          CLOUDFLARE_CONFIGURED: ${{ steps.cloudflare.outputs.configured }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";

          const configured = process.env.CONFIGURED_RUNNER_URL?.trim();
          let url = configured || "";

          if (!url && process.env.CLOUDFLARE_CONFIGURED === "true") {
            const outputPath = process.env.WRANGLER_OUTPUT_FILE_PATH;
            if (!outputPath || !existsSync(outputPath)) {
              throw new Error(
                "Cloudflare runner deployed but Wrangler produced no structured output",
              );
            }

            const urls = [];
            const visit = (value) => {
              if (typeof value === "string") {
                if (/^https:\/\/[^/\\s]+\.workers\.dev\/?$/.test(value)) {
                  urls.push(value.replace(/\/$/, ""));
                }
                return;
              }
              if (Array.isArray(value)) {
                for (const item of value) visit(item);
                return;
              }
              if (value && typeof value === "object") {
                for (const item of Object.values(value)) visit(item);
              }
            };

            for (const line of readFileSync(outputPath, "utf8").split(/\r?\n/)) {
              if (!line.trim()) continue;
              visit(JSON.parse(line));
            }

            url = urls.at(-1) || "";
            if (!url) {
              throw new Error(
                "Cloudflare runner deployed but its workers.dev URL was not present in Wrangler output",
              );
            }
          }

          if (url && !/^https:\/\//.test(url)) {
            throw new Error("QUIDRA_RUNNER_URL must be an HTTPS URL");
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          console.log(
            url
              ? `Using Build/Run runner ${url}`
              : "No Build/Run runner configured; Build/Run will stay disabled",
          );
          NODE
      - name: Build page
        env:
          VITE_QUIDRA_RUNNER_URL: ${{ steps.runner-url.outputs.url }}
        run: npm run build
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish matching native runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: true
          build-args: |
            QUIDRA_CORE_REF=${{ steps.core.outputs.sha }}
          tags: |
            ghcr.io/quidra-lang/playground-runner:main
            ghcr.io/quidra-lang/playground-runner:core-${{ steps.core.outputs.sha }}
      # Pages must be switched on once by a repository admin (Settings > Pages,
      # source "GitHub Actions"). The workflow token cannot create the site
      # itself, so this step only reads the existing configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

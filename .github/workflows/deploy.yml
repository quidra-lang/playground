name: deploy

on:
  push:
    # develop is where this repository advances, and the playground tracks
    # Quidra Core's develop, so that is the branch the published site follows.
    branches: [develop]
  workflow_dispatch:

# The site is static: no backend, no secrets, nothing to configure at runtime.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - run: npm run core:build
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on the first run so deployment needs no
          # manual setup in repository settings.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: deploy

on:
  push:
    # Work lands on develop; publishing is a deliberate fast-forward of main,
    # matching how Quidra Core releases. It is also the only branch the
    # github-pages environment allows to deploy by default.
    branches: [main]
  workflow_dispatch:

# The site is static: no backend, no secrets, nothing to configure at runtime.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - run: npm run core:build
      - run: npm run build
      # Pages must be switched on once by a repository admin (Settings > Pages,
      # source "GitHub Actions"). The workflow token cannot create the site
      # itself, so this step only reads the existing configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

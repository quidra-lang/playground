name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A Playground branch is validated against the same-named Core branch.
# Pull requests validate against the branch they target rather than refs/pull/*.
env:
  QUIDRA_CORE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache

      - run: npm ci

      # Checks out the same-named quidra-lang/quidra branch and builds the
      # frontend to WebAssembly. The compiler is never vendored here.
      - name: Build the matching Quidra compiler frontend
        run: npm run core:build

      # package.json/package-lock.json are private npm metadata, not a second
      # language-version source. Derive them from the selected Core checkout in
      # the workflow workspace before checking consistency.
      - name: Sync package metadata to matching Core
        run: npm run version:sync

      - name: Record the exact Core revision
        run: |
          node -e '
            const meta = require("./.core-build/core-metadata.json");
            console.log(`Core ${meta.coreVersion} @ ${meta.coreCommit} (ref ${meta.coreRef})`);
          ' >> "$GITHUB_STEP_SUMMARY"

      # The playground has no version of its own: after derivation, verify all
      # npm metadata agrees with the selected Core project.toml.
      - name: Version matches Quidra Core
        run: npm run version:check

      - run: npm run typecheck
      - name: Validate Cloudflare runner source and exact-SHA config generation
        run: |
          node --check runner/cloudflare/src/index.js
          QUIDRA_CORE_REF=0123456789abcdef0123456789abcdef01234567 \
          QUIDRA_CORE_VERSION=0.test \
          QUIDRA_PLAYGROUND_ORIGIN=https://quidra-lang.github.io \
            node runner/cloudflare/scripts/configure.mjs
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("runner/cloudflare/wrangler.deploy.json", "utf8"));
            const sha = "0123456789abcdef0123456789abcdef01234567";
            if (config.vars.QUIDRA_CORE_COMMIT !== sha) process.exit(1);
            if (config.containers[0].image_vars.QUIDRA_CORE_REF !== sha) process.exit(1);
          '
      - name: Bundle Cloudflare Sandbox worker with pinned Wrangler
        working-directory: runner/cloudflare
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("wrangler.deploy.json", "utf8"));
            config.containers[0].image =
              "registry.cloudflare.com/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/quidra-playground-runner:ci";
            delete config.containers[0].image_build_context;
            delete config.containers[0].image_vars;
            fs.writeFileSync("wrangler.ci.json", JSON.stringify(config, null, 2) + "\n");
          '
          npx wrangler deploy --dry-run --config wrangler.ci.json --outdir .wrangler-dry-run
      - run: npm test
      - run: npm run test:runner
      - run: npx vite build

      - name: The built page exposes native Build and Run controls
        run: |
          grep -q 'id="action-run"' dist/index.html
          grep -q 'id="action-build"' dist/index.html
          grep -q 'id="execution-output"' dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: dist
          retention-days: 7
